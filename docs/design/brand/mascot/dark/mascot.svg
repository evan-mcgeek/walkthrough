<svg xmlns="http://www.w3.org/2000/svg" class="msc" viewBox="0 0 112 142" width="112" height="142" role="img" aria-label="Walky, the Walkthrough mascot"><title>Walky, the Walkthrough mascot</title><style>svg{--tx:#e5e8ec;--tx2:#c3c8cf;--mut:#9aa2ac;--bg:#15181d;--bg2:#1b1f25;--bg3:#232830;--line:#2c323b;--ok:#5fd38d;--bad:#ff8a80;--sel:#1d2242}.msc .ink{fill:var(--tx)}.msc .eye{fill:var(--bg)}.msc .ln{fill:none;stroke:var(--bg);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.msc .ln.fl{stroke-width:2.2}.msc .ant{stroke:var(--tx);stroke-width:2.4;stroke-linecap:round}.msc .zt{fill:var(--mut);font:600 13px system-ui,-apple-system,'Segoe UI',sans-serif}.msc .zt.z2{font-size:16px}.msc .zz{animation:zz6 4.8s cubic-bezier(0.45,0,0.55,1) infinite}.msc .wv{transform-box:view-box;transform-origin:100px 80px;animation:wave6 1.6s cubic-bezier(0.45,0,0.55,1) .4s both}@media (prefers-reduced-motion: reduce){.msc .zz,.msc .wv{animation:none}}@keyframes zz6{0%,100%{opacity:.55;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}@keyframes wave6{0%{transform:rotate(0)}16%{transform:rotate(18deg)}36%{transform:rotate(-8deg)}56%{transform:rotate(16deg)}76%{transform:rotate(-4deg)}100%{transform:rotate(0)}}</style><line class="ant" x1="56" y1="18" x2="56" y2="8.5"/><circle class="ink" cx="56" cy="8.5" r="3.6"/><rect class="ink" x="20" y="18" width="72" height="60" rx="17"/><rect class="eye" x="41.5" y="37" width="9" height="13" rx="4.5"/><rect class="eye" x="61.5" y="37" width="9" height="13" rx="4.5"/><rect class="ink" x="26" y="82" width="60" height="58" rx="17"/><rect class="ink" x="7" y="104" width="15" height="18" rx="7.5"/><rect class="ink" x="90" y="104" width="15" height="18" rx="7.5"/></svg>
