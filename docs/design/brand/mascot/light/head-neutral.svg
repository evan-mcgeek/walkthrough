<svg xmlns="http://www.w3.org/2000/svg" class="msc" viewBox="-2 -2 76 76" width="76" height="76" role="img" aria-label="Walky, awake"><title>Walky, awake</title><style>svg{--tx:#1d2126;--tx2:#3a4048;--mut:#5b636d;--bg:#ffffff;--bg2:#f6f7f9;--bg3:#eef0f3;--line:#dde1e6;--ok:#1a7340;--bad:#b3261e;--sel:#eef0fd}.msc .ink{fill:var(--tx)}.msc .eye{fill:var(--bg)}.msc .ln{fill:none;stroke:var(--bg);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.msc .ln.fl{stroke-width:2.2}.msc .ant{stroke:var(--tx);stroke-width:2.4;stroke-linecap:round}.msc .zt{fill:var(--mut);font:600 13px system-ui,-apple-system,'Segoe UI',sans-serif}.msc .zt.z2{font-size:16px}.msc .zz{animation:zz6 4.8s cubic-bezier(0.45,0,0.55,1) infinite}.msc .wv{transform-box:view-box;transform-origin:100px 80px;animation:wave6 1.6s cubic-bezier(0.45,0,0.55,1) .4s both}@media (prefers-reduced-motion: reduce){.msc .zz,.msc .wv{animation:none}}@keyframes zz6{0%,100%{opacity:.55;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}@keyframes wave6{0%{transform:rotate(0)}16%{transform:rotate(18deg)}36%{transform:rotate(-8deg)}56%{transform:rotate(16deg)}76%{transform:rotate(-4deg)}100%{transform:rotate(0)}}</style><line class="ant" x1="36" y1="12" x2="36" y2="2.5"/><circle class="ink" cx="36" cy="2.5" r="3.6"/><rect class="ink" x="0" y="12" width="72" height="60" rx="17"/><rect class="eye" x="21.5" y="31" width="9" height="13" rx="4.5"/><rect class="eye" x="41.5" y="31" width="9" height="13" rx="4.5"/></svg>
