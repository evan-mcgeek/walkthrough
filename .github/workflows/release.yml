# A pull request labelled `release` that merges into main is tested in Chromium, built onto the release branch, tagged
# v<version> and given its GitHub Release. Run by hand on main, it finishes a release whose version has no tag yet.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'release'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - name: The version is not released yet
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag is released already; bump the version in package.json and plugin/.claude-plugin/plugin.json"
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - run: npx -y @anthropic-ai/claude-code@2.1.331 plugin validate --strict plugin
      - run: npm run release
      - run: git push origin release
      - name: Tag the build and make its GitHub Release
        run: |
          git tag -a "$TAG" release -m "Walkthrough ${TAG#v}"
          git push origin "$TAG"
          notes="Install or update with \`claude plugin marketplace update walkthrough\` and \`claude plugin update walkthrough@walkthrough\`."
          if [ -n "$PR_NUMBER" ]; then
            notes="$notes"$'\n\n'"$PR_TITLE (#$PR_NUMBER)"$'\n\n'"$PR_BODY"
          fi
          gh release create "$TAG" --verify-tag --latest --title "Walkthrough ${TAG#v}" --notes "$notes"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
