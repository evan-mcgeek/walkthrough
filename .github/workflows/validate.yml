# Every pull request to main checks the plugin, its skills and hooks, and the marketplace manifest the way Claude Code reads them.
name: Validate plugin

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx -y @anthropic-ai/claude-code@2.1.331 plugin validate --strict plugin
      - run: npx -y @anthropic-ai/claude-code@2.1.331 plugin validate --strict .
