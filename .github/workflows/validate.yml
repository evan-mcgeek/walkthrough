# Every pull request to main checks the plugin, its skills and hooks, and the marketplace manifest the way Claude Code
# reads them, and runs the lint and the tests in Chromium. A newer push cancels the run before it; run it by hand on main
# when in doubt. The tests skip a pull request that changes only docs, Markdown, pictures, .gitignore or issue
# templates; the plugin check always runs.
name: Validate plugin

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx -y @anthropic-ai/claude-code@2.1.331 plugin validate --strict plugin
      - run: npx -y @anthropic-ai/claude-code@2.1.331 plugin validate --strict .

  # Whether the pull request changes anything the tests cover: the skills and the brand files the page ships count.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: files
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then echo code=true >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BASE" HEAD)
          if grep -qvE '(\.md$|^docs/|^LICENSE$|^\.scratch/|^\.gitignore$|^\.github/ISSUE_TEMPLATE/)' <<< "$files" || grep -qE '^(plugin/|docs/design/brand/)' <<< "$files"; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi
        env:
          BASE: ${{ github.event.pull_request.base.sha }}

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # A policy test reads a template from an earlier commit.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
