<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Walkthrough</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script type="module" src="app.js"></script>
  </head>
  <body class="walkthrough">
    <header id="header" class="app-header"></header>
    <p id="alert" class="banner attention" role="alert" hidden></p>
    <div id="panes" class="panes">
      <div id="left-edge" class="edge-stripe left" role="toolbar" aria-label="Hidden panels" hidden></div>
      <nav id="queue" class="queue" aria-label="To review"></nav>
      <div class="center">
        <main id="main" class="main"></main>
      </div>
      <aside id="side" class="side" aria-label="Checklist" hidden></aside>
      <div id="right-edge" class="edge-stripe right" role="toolbar" aria-label="Hidden panels" hidden></div>
    </div>
  </body>
</html>
